<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Awarding Mythic 3.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0e2347; --blue: #1f6bff; --green: #8cff1f; --gold: #ffc93c;
    --ink: #0e2347; --paper: #e3e8f6;
    --display: "Dela Gothic One", Impact, "Arial Black", sans-serif;
    --body: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--navy); overflow: hidden; cursor: none; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    background: var(--paper) url(assets/background.png) center / cover; font-family: var(--body); color: var(--ink); }

  .slide { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity .55s ease; }
  .slide.active { opacity: 1; }
  .center { position: absolute; inset: 0 0 170px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

  /* ---------- komponen ---------- */
  .chip { display: inline-block; background: var(--navy); color: #fff; font: 400 40px/1 var(--display); padding: 18px 44px;
    transform: skewX(-10deg); letter-spacing: .02em; }
  .chip > span { display: inline-block; transform: skewX(10deg); }
  .chip.green { background: var(--green); color: var(--navy); }
  .chip.blue { background: var(--blue); }

  /* pop-in umum */
  .pop { opacity: 0; }
  .on .pop { animation: pop .7s cubic-bezier(.2, 1.3, .4, 1) both; animation-delay: var(--d, 0s); }
  @keyframes pop { from { opacity: 0; transform: translateY(46px) scale(.82); } to { opacity: 1; transform: none; } }
  .chip.pop { }
  .on .chip.pop { animation-name: popSkew; }
  @keyframes popSkew { from { opacity: 0; transform: skewX(-10deg) translateY(46px) scale(.82); } to { opacity: 1; transform: skewX(-10deg); } }

  /* sponsor loop */
  .sponsor { position: absolute; left: 0; right: 0; top: 845px; height: 150px; z-index: 5; }
  .sp-text, .sp-logos { position: absolute; left: 50%; top: 50%; opacity: 0; transition: opacity .6s ease, transform .7s cubic-bezier(.2, .9, .3, 1), letter-spacing .9s ease, filter .6s ease; }
  .sp-text { font: 400 54px/1 var(--display); color: var(--navy); white-space: nowrap; letter-spacing: .7em;
    transform: translate(-50%, -30%) skewX(-10deg); filter: blur(6px); }
  .sp-text b { color: var(--blue); font-weight: 400; }
  .sp-text.in { opacity: 1; letter-spacing: .12em; transform: translate(-50%, -50%) skewX(-10deg); filter: none; }
  .sp-text.out { opacity: 0; letter-spacing: -.02em; transform: translate(-50%, -80%) skewX(-10deg); filter: blur(6px); }
  .sp-logos { width: 1180px; transform: translate(-50%, -20%) scale(.9); filter: blur(8px); }
  .sp-logos.in { opacity: 1; transform: translate(-50%, -50%); filter: none; }
  .sp-logos.out { opacity: 0; transform: translate(-50%, -85%) scale(1.04); filter: blur(8px); }

  /* ---------- idle ---------- */
  .idle-slide .inst { position: absolute; top: 118px; left: 660px; width: 600px; }   /* tengah = 960; tanpa transform karena animasi pop menimpanya */
  .idle-slide .logo { position: absolute; left: 50%; top: 480px; width: 1150px; transform: translate(-50%, -50%); }
  .on .logo { animation: logoIn 1.1s cubic-bezier(.2, 1.2, .4, 1) both, float 5s ease-in-out 1.2s infinite; }
  @keyframes logoIn { from { opacity: 0; transform: translate(-50%, -50%) scale(.6) rotate(-4deg); } to { opacity: 1; transform: translate(-50%, -50%); } }
  @keyframes float { 50% { transform: translate(-50%, -52%); } }

  /* ---------- kategori ---------- */
  .kat-slide .small { font: 800 44px/1 var(--body); letter-spacing: .5em; text-transform: uppercase; margin-bottom: 26px; }
  .kat-slide .big { font: 400 var(--fs, 250px)/1.02 var(--display); max-width: 1700px; text-transform: uppercase; color: var(--navy); -webkit-text-stroke: 0; text-shadow: 10px 10px 0 var(--green), 20px 20px 0 var(--blue); margin: 40px 0 70px; }
  .kat-slide .cabang { margin-top: 10px; display: flex; gap: 20px; }
  .kat-slide .cabang .chip { font-size: 26px; padding: 12px 28px; opacity: .45; }
  .kat-slide .cabang .chip.now { opacity: 1; background: var(--green); color: var(--navy); }

  /* ---------- teaser ---------- */
  .ring { position: absolute; left: 50%; top: 50%; width: 560px; height: 560px; margin: -280px 0 0 -280px; border-radius: 50%;
    border: 10px solid var(--blue); opacity: 0; }
  .on .ring { animation: ring 1.8s ease-out infinite; }
  .on .ring.r2 { animation-delay: .6s; border-color: var(--green); }
  .on .ring.r3 { animation-delay: 1.2s; }
  @keyframes ring { 0% { transform: scale(.35); opacity: .9; } 100% { transform: scale(2.1); opacity: 0; } }
  .teaser .num { font: 400 520px/.9 var(--display); color: var(--navy); text-shadow: 14px 14px 0 var(--green), 28px 28px 0 var(--blue); position: relative; }
  .teaser.on .num { animation: beat .55s ease-in-out infinite alternate; }
  @keyframes beat { to { transform: scale(1.05); } }
  .teaser .line { font: 400 70px/1 var(--display); margin-top: 40px; position: relative; }
  .teaser .dots { font: 400 120px/1 var(--display); color: var(--blue); letter-spacing: .15em; height: 100px; position: relative; }
  .dots i { font-style: normal; opacity: .15; }
  .on .dots i { animation: dot 1.2s infinite; }
  .on .dots i:nth-child(2) { animation-delay: .25s; }
  .on .dots i:nth-child(3) { animation-delay: .5s; }
  @keyframes dot { 0%, 60%, 100% { opacity: .15; } 30% { opacity: 1; } }

  /* ---------- efek dramatis ---------- */
  .center { translate: 0 0; }
  .vig { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse 75% 85% at 50% 48%, transparent 28%, rgba(8, 20, 46, .72) 100%); }
  .on .vig { animation: vig 9s ease-in forwards; }
  @keyframes vig { to { opacity: 1; } }
  .teaser.on .center { animation: slowzoom 12s linear forwards; }
  @keyframes slowzoom { to { scale: 1.12; } }
  .teaser .num { text-shadow: 14px 14px 0 var(--green), 28px 28px 0 var(--blue), 0 0 60px #1f6bff99; }
  .line span, .reveal .name span { display: inline-block; }
  .teaser .line { color: var(--navy); }
  .teaser.on .line span { animation: typeIn .4s cubic-bezier(.2, 1.4, .4, 1) both; animation-delay: calc(.35s + var(--i) * .05s); }
  @keyframes typeIn { from { opacity: 0; transform: translateY(-40px) scale(1.7); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
  /* panggung gelap -> lampu sorot menyala satu-satu -> menyapu ke tengah -> panggung terang membuka dari tengah */
  @property --r { syntax: "<percentage>"; inherits: false; initial-value: -10%; }
  .reveal { --t0: .35s; }
  .reveal.nofx { --t0: 0s; }
  .dark { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 48%, transparent var(--r), #040b1c calc(var(--r) + 16%)); }
  .reveal.nofx .dark { display: none; }
  .reveal.on .dark { animation: iris 1.05s cubic-bezier(.55, 0, .25, 1) calc(var(--t0) - .15s) both; }
  @keyframes iris { from { --r: -10%; } to { --r: 115%; } }
  .lights { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .beam { position: absolute; top: -60px; width: 520px; height: 1500px; transform-origin: 50% 0; opacity: 0; rotate: var(--a0); mix-blend-mode: screen;
    background: linear-gradient(180deg, rgba(255, 255, 255, .95), rgba(170, 215, 255, .42) 48%, rgba(120, 180, 255, 0) 100%);
    clip-path: polygon(47% 0, 53% 0, 100% 100%, 0 100%); }
  .lights-slide { background: #040b1c; }
  .lights-slide::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 38% 26% at 50% 52%, rgba(150, 195, 255, .30), transparent 70%); }
  .lights-slide.on .beam { animation: lampOn .75s linear var(--d) both, sweep .9s cubic-bezier(.5, 0, .25, 1) .95s both; }
  @keyframes lampOn { 0% { opacity: 0; } 12% { opacity: .95; } 20% { opacity: .15; } 32% { opacity: 1; } 42% { opacity: .35; } 60% { opacity: 1; } 100% { opacity: 1; } }
  @keyframes sweep { from { rotate: var(--a0); } to { rotate: var(--a1); } }
  @keyframes lampOff { to { opacity: 0; } }
  .reveal.on .pop { animation-delay: calc(var(--t0) + var(--d, 0s)); }
  .reveal.on .flash { animation: flash .9s ease-out var(--t0) forwards; }
  /* papan sponsor menyala saat panggung gelap */
  .sponsor::before { content: ""; position: absolute; left: 50%; top: 50%; width: 1320px; height: 112px; margin: -56px 0 0 -660px; background: #f2f6ff; transform: skewX(-10deg); opacity: 0; transition: opacity .45s; }
  .blackout .sponsor::before { opacity: .97; }

  /* ---------- reveal ---------- */
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .on .flash { animation: flash .9s ease-out both; }
  @keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }
  .reveal .name { font: 400 140px/1.05 var(--display); color: var(--navy); white-space: nowrap; text-transform: uppercase; margin: 30px 0 20px;
    text-shadow: 7px 7px 0 var(--green); }
  .reveal.on .name span { animation: letter .65s cubic-bezier(.2, 1.5, .4, 1) both; animation-delay: calc(var(--t0) + .12s + var(--i) * .05s); }
  @keyframes letter { from { opacity: 0; transform: translateY(-160px) scale(2.8) rotate(-14deg); filter: blur(14px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes slam { from { opacity: 0; transform: scale(2.2); filter: blur(14px); } to { opacity: 1; transform: none; filter: none; } }
  .reveal .school { font: 800 40px/1.2 var(--body); max-width: 1500px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 38px; }
  .reveal .members { display: flex; gap: 22px; margin-top: 46px; }
  .reveal .members .chip { font: 700 34px/1 var(--body); background: #fff; color: var(--navy); border: 4px solid var(--blue); padding: 18px 34px; }
  .reveal.gold .name { text-shadow: 7px 7px 0 var(--gold), 14px 14px 0 var(--blue); }
  canvas.confetti { position: absolute; inset: 0; pointer-events: none; }

  /* ---------- penutup ---------- */
  .closing-slide .head { position: absolute; top: 62px; left: 0; right: 0; text-align: center; font: 400 70px/1 var(--display); }
  .closing-slide .head small { display: block; font: 800 28px/1 var(--body); letter-spacing: .45em; margin-bottom: 16px; color: var(--blue); }
  .podium { position: absolute; left: 0; top: 0; width: 1920px; height: 815px; }
  .pod { position: absolute; bottom: 0; width: 470px; height: var(--h); }
  .pod .block { position: absolute; inset: 0; background: linear-gradient(180deg, #17336a, var(--navy)); border-top: 16px solid var(--green);
    display: flex; align-items: center; justify-content: center; transform-origin: 50% 100%; overflow: hidden; }
  .pod .block::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, transparent 0 46px, #ffffff0d 46px 92px); }
  .pod .block b { position: relative; font: 400 var(--n) / 1 var(--display); color: #fff; text-shadow: 6px 6px 0 var(--blue); }
  .pod.first .block { border-top-color: var(--gold); }
  .pod.first .block b { text-shadow: 6px 6px 0 #c98f00; color: var(--gold); }
  .on .pod .block { animation: rise .9s cubic-bezier(.2, 1, .3, 1) both; animation-delay: var(--bd); }
  @keyframes rise { from { transform: scaleY(0); } to { transform: none; } }
  .pod .info { position: absolute; left: -20px; right: -20px; bottom: calc(100% + 22px); text-align: center; }
  .pod .tim { font: 400 var(--fs) / 1.08 var(--display); text-transform: uppercase; text-shadow: 4px 4px 0 var(--green); }
  .pod.first .tim { text-shadow: 4px 4px 0 var(--gold); }
  .pod .sek { font: 800 21px/1.25 var(--body); text-transform: uppercase; letter-spacing: .03em; margin: 12px 20px 14px; }
  .pod .chip { font-size: 26px; padding: 10px 26px; }
  .pod .crown { width: 110px; display: block; margin: 0 auto 6px; filter: drop-shadow(0 4px 0 #c98f00); }
  .on .pod .info { animation: pop .7s cubic-bezier(.2, 1.3, .4, 1) both; animation-delay: var(--id); }
  .on .pod.first .crown { animation: crown 1.8s ease-in-out infinite alternate; }
  @keyframes crown { to { transform: translateY(-10px) rotate(-4deg); } }

  #hint { position: absolute; left: 36px; bottom: 28px; font: 700 22px var(--body); color: var(--navy); background: #ffffffcc; padding: 8px 18px; transition: opacity 1s; }
</style>
</head>
<body>
<div id="stage">

  <!-- 0. idle -->
  <section class="slide idle-slide" id="s-idle">
    <img class="inst pop" src="assets/institusi.png" alt="">
    <img class="logo" src="assets/logo-awarding.png" alt="Awarding Mythic 3.0">
  </section>

  <div id="dyn"></div>

  <div class="sponsor" id="sponsor"></div>

  <div id="hint">◀ ▶ &nbsp;panah untuk lanjut / mundur &nbsp;·&nbsp; F layar penuh</div>
</div>

<script>
/* ===================== DATA (edit di sini) ===================== */
// urutan = urutan pengumuman. tim boleh dikosongkan (Mobile Legends = nama sekolah); skor & anggota boleh dikosongkan.
const EVENT = { kategori: [
  { nama: "Battle of Brain", label: "Battle of Brain", juara: [
    { rank: 1, tim: "Vladimir Angkason", skor: "269,35", sekolah: "SMK IDN Boarding School Solo",
      anggota: ["Rahmad Arifin Susilo", "Muhammad Hideaki I.", "Aditya Putra Mustofa"] },
    { rank: 2, tim: "Tahu Tech", skor: "266,45", sekolah: "SMAN 2 Mejayan",
      anggota: ["M. Rizky Husein F.", "Bariq Akram", "Samuel Satria W."] },
    { rank: 3, tim: "Conquest", skor: "250,75", sekolah: "SMA Islam Al-Azhar 4 Kemenag Pratama Bekasi",
      anggota: ["Muhammad Zhafran A.", "Kirany Safia Karen", "Kennard Yusuf Mahardika"] } ] },
  { nama: "Innovation Technology Pelajar", label: "Inotech Pelajar", juara: [
    { rank: 1, tim: "TutuTitut", sekolah: "SMK Negeri 2 Klaten" },
    { rank: 2, tim: "captcha Kaki 3", sekolah: "SMA Islam Al-Azhar 4 Kemenag Pratama Bekasi" },
    { rank: 3, tim: "Walahwe Team", sekolah: "SMA Negeri 1 Geger" } ] },
  { nama: "Innovation Technology Mahasiswa", label: "Inotech Mahasiswa", juara: [
    { rank: 1, tim: "ARD", sekolah: "Universitas Brawijaya" },
    { rank: 2, tim: "Sekawan", sekolah: "Universitas Sebelas Maret" },
    { rank: 3, tim: "BAJIRUT", sekolah: "UIN Walisongo Semarang" } ] },
  { nama: "Mobile Legends", label: "Mobile Legends", juara: [
    { rank: 1, sekolah: "SMAN 1 Kertosono" },
    { rank: 2, sekolah: "SMAN 2 Mojokerto" },
    { rank: 3, sekolah: "SMAN 2 Madiun" } ] },
] };

/* ===================== AUDIO (disintesis, tanpa file) =====================
   Kalau ada file di audio/ (drumroll.mp3, jeng.mp3, popper.mp3, fanfare.mp3, applause.mp3), file itu dipakai menggantikan suara sintetis. */
let AC, master, noiseBuf, buses = [];
const files = {};
function audio() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.9;
    const comp = AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    for (const n of ["drumroll", "jeng", "popper", "fanfare", "fanfareShort", "applause"]) {
      fetch(`audio/${n}.mp3`).then(r => r.ok ? r.arrayBuffer() : Promise.reject()).then(b => AC.decodeAudioData(b)).then(buf => files[n] = buf).catch(() => {});
    }
  }
  if (AC.state === "suspended") AC.resume();
  return AC;
}
function bus() { const g = AC.createGain(); g.connect(master); buses.push(g); return g; }
function killAudio() {
  if (!AC) return;
  const t = AC.currentTime;
  for (const g of buses) { try { g.gain.cancelScheduledValues(t); g.gain.setTargetAtTime(0, t, 0.06); setTimeout(() => g.disconnect(), 600); } catch (e) {} }
  buses = [];
}
function noise(b, t, dur, { type = "bandpass", f = 2000, q = 1, vol = 0.5, attack = 0.002, offset } = {}) {
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const flt = AC.createBiquadFilter(); flt.type = type; flt.frequency.value = f; flt.Q.value = q;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(flt); flt.connect(g); g.connect(b);
  s.start(t, offset ?? Math.random() * 1.5, dur + 0.05);
  return g;
}
function brass(b, f, t, dur, vol = 0.18) {
  for (const det of [-7, 7]) {
    const o = AC.createOscillator(); o.type = "sawtooth"; o.frequency.value = f; o.detune.value = det;
    const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = 2;
    lp.frequency.setValueAtTime(f * 1.5, t); lp.frequency.linearRampToValueAtTime(f * 7, t + 0.06); lp.frequency.exponentialRampToValueAtTime(f * 3, t + dur);
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.025);
    g.gain.setValueAtTime(vol * 0.8, t + dur * 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(lp); lp.connect(g); g.connect(b); o.start(t); o.stop(t + dur + 0.05);
  }
}
const chord = (b, f, t, dur, vol) => { for (const m of [0.5, 1, 1.25, 1.5]) brass(b, f * m, t, dur, vol); };
function boom(b, t, vol = 0.9) {
  const o = AC.createOscillator(); o.type = "sine"; o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.7);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
  o.connect(g); g.connect(b); o.start(t); o.stop(t + 1.2);
}
function playFile(name, vol = 1, { loop = false, rampFrom, rampTime = 8 } = {}) {
  if (!files[name]) return false;
  const b = bus(), t = AC.currentTime;
  if (rampFrom != null) { b.gain.setValueAtTime(0.0001, t); b.gain.linearRampToValueAtTime(vol * rampFrom, t + 0.6); b.gain.linearRampToValueAtTime(vol, t + rampTime); }
  else b.gain.value = vol;
  const s = AC.createBufferSource(); s.buffer = files[name]; s.loop = loop; s.connect(b); s.start(); return true;
}

const sfx = {
  lamp(t0 = 0) { audio(); const b = bus(), t = AC.currentTime + t0;   // lampu sorot menyala: klak + dengung
    noise(b, t, 0.05, { type: "highpass", f: 2500, q: 0.8, vol: 0.6, attack: 0.001 });
    const o = AC.createOscillator(); o.type = "sine"; o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(48, t + 0.2);
    const g = AC.createGain(); g.gain.setValueAtTime(0.7, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28); o.connect(g); g.connect(b); o.start(t); o.stop(t + 0.3);
    const h = AC.createOscillator(); h.type = "sawtooth"; h.frequency.value = 100; const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 500;
    const hg = AC.createGain(); hg.gain.setValueAtTime(0.0001, t); hg.gain.linearRampToValueAtTime(0.06, t + 0.03); hg.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
    h.connect(lp); lp.connect(hg); hg.connect(b); h.start(t); h.stop(t + 0.75); },
  whoosh() { audio(); const b = bus(), t = AC.currentTime; const g = noise(b, t, 0.55, { f: 500, q: 1.2, vol: 0.25, attack: 0.25 });
    // naik frekuensi
    const s = AC.createBufferSource(); s.buffer = noiseBuf; const f = AC.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 1.5;
    f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(5000, t + 0.5);
    const gg = AC.createGain(); gg.gain.setValueAtTime(0.0001, t); gg.gain.linearRampToValueAtTime(0.3, t + 0.25); gg.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
    s.connect(f); f.connect(gg); gg.connect(b); s.start(t, 0, 0.6); },
  jeng() { audio(); if (playFile("jeng")) return; const b = bus(), t = AC.currentTime + 0.05;
    chord(b, 261.63, t, 0.28, 0.16); chord(b, 293.66, t + 0.32, 0.28, 0.17); chord(b, 329.63, t + 0.64, 1.3, 0.2);
    boom(b, t, 0.7); boom(b, t + 0.32, 0.7); boom(b, t + 0.64, 1);
    noise(b, t + 0.64, 2.2, { type: "highpass", f: 4500, q: 0.7, vol: 0.28, attack: 0.005 }); },
  // drumroll: pakai rekaman asli audio/drumroll.mp3 (di-loop sampai ganti slide); sintetis hanya cadangan
  drumroll(dur = 9) { audio(); if (playFile("drumroll", 1, { loop: true, rampFrom: 0.55, rampTime: 9 })) return; const b = bus(), t0 = AC.currentTime + 0.05;
    let t = t0, gap = 0.16;
    while (t < t0 + dur) {
      const p = (t - t0) / dur;
      noise(b, t, 0.1, { f: 1900, q: 0.9, vol: 0.18 + 0.5 * p });
      noise(b, t + gap / 2, 0.09, { f: 2600, q: 1.1, vol: 0.12 + 0.35 * p });
      gap = Math.max(0.045, gap * 0.985); t += gap;
    }
    const o = AC.createOscillator(); o.type = "sine"; o.frequency.setValueAtTime(55, t0); o.frequency.linearRampToValueAtTime(95, t0 + dur);
    const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(0.5, t0 + dur); o.connect(g); g.connect(b); o.start(t0); o.stop(t0 + dur + 0.2);
    // crescendo cymbal swell
    noise(b, t0, dur, { type: "highpass", f: 6000, q: 0.5, vol: 0.18, attack: dur * 0.95 }); },
  popper(t0 = 0, vol = 1) { audio(); if (playFile("popper", vol)) return; const b = bus(), t = AC.currentTime + 0.02 + t0;
    // "pop" tajam
    noise(b, t, 0.09, { type: "lowpass", f: 2200, q: 0.7, vol: 1.1 * vol, attack: 0.001 });
    noise(b, t, 0.05, { type: "highpass", f: 3000, q: 0.7, vol: 0.7 * vol, attack: 0.001 });
    const o = AC.createOscillator(); o.type = "sine"; o.frequency.setValueAtTime(320, t); o.frequency.exponentialRampToValueAtTime(70, t + 0.09);
    const g = AC.createGain(); g.gain.setValueAtTime(0.9 * vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    o.connect(g); g.connect(b); o.start(t); o.stop(t + 0.16);
    // desis pita/kertas melayang + gemerisik konfeti jatuh
    noise(b, t + 0.03, 0.7, { type: "bandpass", f: 6500, q: 0.6, vol: 0.28 * vol, attack: 0.02 });
    for (let i = 0; i < 26; i++) noise(b, t + 0.15 + Math.random() * 1.3, 0.03, { type: "highpass", f: 4000 + Math.random() * 4000, q: 1, vol: (0.05 + Math.random() * 0.07) * vol }); },
  fanfare(short) { audio(); if (playFile(short ? "fanfareShort" : "fanfare")) return;   // terompet asli (Ruffles and Flourishes)
    const b = bus(), t = AC.currentTime + 0.35;
    const seq = [[392, 0, .16], [392, .19, .16], [392, .38, .16], [523.25, .6, .7], [392, 1.4, .16], [523.25, 1.62, .3], [659.25, 2.0, 1.6]];
    for (const [f, d, l] of seq) chord(b, f, t + d, l, 0.17);
    const o = [783.99, 1046.5]; for (const f of o) brass(b, f, t + 2.0, 1.6, 0.07);
    boom(b, t + 2.0, 0.8); noise(b, t + 2.0, 3, { type: "highpass", f: 4000, q: 0.7, vol: 0.3, attack: 0.005 }); },
  applause(dur = 5) { audio();
    if (files.applause) { const b = bus(), t = AC.currentTime + 0.05;   // rekaman tepuk tangan asli, dipotong pakai fade sesuai durasi
      b.gain.setValueAtTime(1, t); b.gain.setValueAtTime(1, t + Math.max(0, dur - 2)); b.gain.linearRampToValueAtTime(0.0001, t + dur);
      const s = AC.createBufferSource(); s.buffer = files.applause; s.connect(b); s.start(t); return; } const b = bus(), t = AC.currentTime + 0.1;
    const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = AC.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 2600; f.Q.value = 0.45;
    const g = AC.createGain(); const n = Math.floor(dur * 14), curve = new Float32Array(n);
    for (let i = 0; i < n; i++) { const p = i / n; curve[i] = (0.10 + Math.random() * 0.22) * Math.min(1, p * 6) * (1 - Math.pow(p, 3)); }
    g.gain.setValueCurveAtTime(curve, t, dur);
    s.connect(f); f.connect(g); g.connect(b); s.start(t); s.stop(t + dur + 0.1);
    for (let i = 0; i < dur * 30; i++) noise(b, t + Math.random() * dur, 0.05, { f: 1500 + Math.random() * 3000, q: 1.2, vol: 0.12 * (1 - i / (dur * 30) * 0.6) }); },
};

/* ===================== SLIDES ===================== */
const $ = (s, el = document) => el.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const BEAMS = [[300, 26, -52, .15], [1620, -26, 52, .45], [960, -14, 0, .75], [640, 20, -28, 1.0], [1300, -20, 28, 1.15]];
const beams = r => BEAMS.slice(0, r === 1 ? 5 : 3).map(([x, a0, a1, d]) => `<i class="beam" style="left:${x - 260}px; --a0:${a0}deg; --a1:${a1}deg; --d:${d}s"></i>`).join("");
const letters = t => [...t].map((ch, i) => `<span style="--i:${i}">${ch === " " ? "&nbsp;" : esc(ch)}</span>`).join("");
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const ORD = { 3: "TIGA", 2: "DUA", 1: "SATU" };

const dyn = $("#dyn");
const CROWN = `<svg class="crown" viewBox="0 0 120 80"><path d="M8 66 L2 14 L36 40 L60 4 L84 40 L118 14 L112 66 Z" fill="#ffc93c" stroke="#0e2347" stroke-width="5" stroke-linejoin="round"/><rect x="8" y="66" width="104" height="10" fill="#0e2347"/></svg>`;
const POD = { 1: { x: 725, h: 320, n: 190, bd: 1.0, id: 1.7 }, 2: { x: 250, h: 235, n: 140, bd: 0.5, id: 1.2 }, 3: { x: 1200, h: 170, n: 100, bd: 0.1, id: 0.8 } };
const mainName = j => j.tim || j.sekolah;             // tanpa nama tim -> nama sekolah jadi judul

EVENT.kategori.forEach((K, c) => {
  const byRank = r => K.juara.find(j => j.rank === r);
  const kfs = K.nama.length <= 10 ? 250 : K.nama.length <= 18 ? 170 : 124;
  dyn.insertAdjacentHTML("beforeend", `
  <section class="slide kat-slide" id="s-k${c}"><div class="center">
    <div class="small pop">Awarding Mythic 3.0</div>
    <div class="chip green pop" style="--d:.25s"><span>KATEGORI LOMBA</span></div>
    <div class="big pop" style="--d:.55s; --fs:${kfs}px">${esc(K.nama)}</div>
    <div class="cabang pop" style="--d:.9s">${EVENT.kategori.map(o => `<div class="chip ${o === K ? "now" : ""}"><span>${esc(o.label)}</span></div>`).join("")}</div>
  </div></section>`);

  for (const r of [3, 2, 1]) {
    const j = byRank(r); if (!j) continue;
    const nm = mainName(j), fs = nm.length <= 10 ? 190 : nm.length <= 14 ? 150 : nm.length <= 18 ? 118 : 92;
    dyn.insertAdjacentHTML("beforeend", `
  <section class="slide teaser" id="s-t${c}-${r}"><div class="vig"></div><div class="center">
    <div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div>
    <div class="num">${r}</div>
    <div class="line">${letters(`JUARA ${r} DIPEROLEH OLEH`)}</div>
    <div class="dots"><i>●</i><i>●</i><i>●</i></div>
  </div></section>
  <section class="slide lights-slide" id="s-l${c}-${r}"><div class="lights">${beams(r)}</div></section>
  <section class="slide reveal ${r === 1 ? "gold" : ""}" id="s-r${c}-${r}"><div class="center">
    <div class="chip ${r === 1 ? "green" : "blue"} pop"><span>JUARA ${r} · ${esc(K.label)}</span></div>
    <div class="name" style="font-size:${fs}px">${letters(nm)}</div>
    ${j.tim ? `<div class="school pop" style="--d:.7s">${esc(j.sekolah)}</div>` : ""}
    ${j.skor ? `<div class="chip green pop" style="--d:.95s"><span>SKOR ${esc(j.skor)}</span></div>` : ""}
    ${j.anggota ? `<div class="members">${j.anggota.map((a, i) => `<div class="chip pop" style="--d:${1.2 + i * .18}s"><span>${esc(a)}</span></div>`).join("")}</div>` : ""}
  </div>
  <div class="dark"></div><div class="flash"></div>
  <canvas class="confetti" width="1920" height="1080"></canvas></section>`);
  }

  const pods = [2, 1, 3].map(byRank).filter(Boolean).map(j => {
    const P = POD[j.rank], nm = mainName(j), fs = nm.length <= 10 ? 56 : nm.length <= 14 ? 48 : 42;
    return `<div class="pod ${j.rank === 1 ? "first" : ""}" style="left:${P.x}px; --h:${P.h}px; --n:${P.n}px; --bd:${P.bd}s; --id:${P.id}s; --fs:${fs}px">
    <div class="info">${j.rank === 1 ? CROWN : ""}<div class="tim">${esc(nm)}</div>${j.tim ? `<div class="sek">${esc(j.sekolah)}</div>` : ""}
      ${j.skor ? `<div class="chip ${j.rank === 1 ? "green" : "blue"}"><span>SKOR ${esc(j.skor)}</span></div>` : ""}</div>
    <div class="block"><b>${j.rank}</b></div></div>`;
  }).join("");
  dyn.insertAdjacentHTML("beforeend", `
  <section class="slide closing-slide" id="s-c${c}">
    <div class="head pop"><small>AWARDING MYTHIC 3.0 · ${esc(K.nama)}</small>SELAMAT KEPADA PARA JUARA</div>
    <div class="podium">${pods}</div>
  </section>`);
});

const SPONSOR_HTML = `<div class="sp-text">SPONSORED <b>BY</b></div><img class="sp-logos" src="assets/sponsor.png" alt="">`;
document.querySelectorAll(".sponsor").forEach(el => el.innerHTML = SPONSOR_HTML);

/* urutan slide; tiap slide: id, aksi saat masuk */
const slides = [{ id: "s-idle" }];
EVENT.kategori.forEach((K, c) => {
  slides.push({ id: `s-k${c}`, sound: () => { sfx.whoosh(); sfx.jeng(); } });
  for (const r of [3, 2, 1]) {
    if (!K.juara.find(j => j.rank === r)) continue;
    slides.push({ id: `s-t${c}-${r}`, sound: () => sfx.drumroll(10) });
    slides.push({ id: `s-l${c}-${r}`,                                    // lampu sorot: tahan sampai kita geser kanan lagi
      sound: () => {
        [0.15, 0.45, 0.75, ...(r === 1 ? [1.0, 1.15] : [])].forEach(t => sfx.lamp(t));
        later(950, () => sfx.whoosh());
      },
      enter: () => stage.classList.add("blackout") });
    slides.push({ id: `s-r${c}-${r}`,                                    // nama juara muncul
      sound: () => {
        stage.classList.add("blackout"); later(700, () => stage.classList.remove("blackout"));
        later(350, () => { sfx.popper(0); confetti(r === 1 ? 1 : 0.55); sfx.fanfare(r !== 1); });
      } });
  }
  slides.push({ id: `s-c${c}`, sound: () => { sfx.whoosh(); sfx.applause(10); } });   // tepuk tangan hanya di podium
});
// slide penutup: sama dengan slide pembuka (logo Awarding + institusi), sponsor tetap jalan
const endSlide = document.getElementById("s-idle").cloneNode(true); endSlide.id = "s-end"; dyn.appendChild(endSlide);
slides.push({ id: "s-end", sound: () => sfx.whoosh() });
slides.forEach(s => s.el = document.getElementById(s.id));

/* loop sponsor: teks masuk, keluar, logo masuk, keluar, ulang */
let loopToken = 0;
async function sponsorLoop(root) {
  const tok = ++loopToken;
  const txt = $(".sp-text", root), logos = $(".sp-logos", root);
  const set = (el, cls) => { el.classList.remove("in", "out"); if (cls) el.classList.add(cls); };
  const alive = () => tok === loopToken;
  set(txt); set(logos);
  await sleep(900);
  while (alive()) {
    set(txt, "in"); await sleep(3200); if (!alive()) break;
    set(txt, "out"); await sleep(900); if (!alive()) break;
    set(txt); set(logos, "in"); await sleep(5200); if (!alive()) break;
    set(logos, "out"); await sleep(900); if (!alive()) break;
    set(logos);
  }
}

/* confetti */
let confettiRun = 0;
function confetti(scale = 1) {
  const cv = $(".slide.active canvas.confetti"); if (!cv) return;
  const c = cv.getContext("2d"), run = ++confettiRun;
  const cols = ["#1f6bff", "#8cff1f", "#0e2347", "#ffc93c", "#ffffff", "#ff4f8b"];
  const burst = (side, delay, n) => Array.from({ length: n }, () => {
    const ang = (side < 0 ? -60 : -120) + (Math.random() - .5) * 38, sp = 22 + Math.random() * 24, rad = ang * Math.PI / 180;
    return { x: side < 0 ? 40 : 1880, y: 1060, vx: Math.cos(rad) * sp, vy: Math.sin(rad) * sp, w: 10 + Math.random() * 14, h: 5 + Math.random() * 9,
      r: Math.random() * 6, vr: (Math.random() - .5) * .5, c: cols[Math.floor(Math.random() * cols.length)], delay };
  });
  const n = Math.round(150 * scale);
  const ps = [...burst(-1, 2, n), ...burst(1, 2, n), ...(scale >= 1 ? [...burst(-1, 30, n), ...burst(1, 36, n)] : [])];
  let f = 0;
  (function tick() {
    if (run !== confettiRun) { c.clearRect(0, 0, 1920, 1080); return; }
    c.clearRect(0, 0, 1920, 1080); f++;
    for (const p of ps) {
      if (f < p.delay) continue;
      p.vy += 0.5; p.vx *= 0.985; p.vy *= 0.985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      c.save(); c.translate(p.x, p.y); c.rotate(p.r); c.fillStyle = p.c; c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2))); c.restore();
    }
    if (f < 480) requestAnimationFrame(tick); else c.clearRect(0, 0, 1920, 1080);
  })();
}

/* jadwal suara/efek yang ditunda; dibatalkan saat pindah slide */
const stage = document.getElementById("stage");
let timers = [];
const later = (ms, fn) => timers.push(setTimeout(fn, ms));
const clearLater = () => { timers.forEach(clearTimeout); timers = []; };

/* navigasi */
let cur = -1, leaveTimer;
function go(i) {
  if (i < 0 || i >= slides.length || i === cur) return;
  const back = i < cur;   // mundur (panah kiri) = tanpa suara
  audio(); killAudio(); confettiRun++; clearLater(); stage.classList.remove("blackout");
  const prev = slides[cur];
  if (prev) { prev.el.classList.remove("active"); const el = prev.el; setTimeout(() => { if (slides[cur] && slides[cur].el !== el) el.classList.remove("on"); }, 700); }
  cur = i;
  const s = slides[cur];
  s.el.classList.toggle("nofx", back); s.el.classList.remove("on"); void s.el.offsetWidth;
  s.el.classList.add("active", "on");
  if (s.sound && !back) s.sound();
  if (s.enter) s.enter();
  try { history.replaceState(null, "", "#" + (cur + 1)); } catch (e) {}
}
addEventListener("keydown", e => {
  if (e.key === "ArrowRight") go(cur + 1);
  else if (e.key === "ArrowLeft") go(cur - 1);
  else if (e.key.toLowerCase() === "f") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  else return;
  e.preventDefault();
});

/* skala layar */
function fit() { const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  const st = $("#stage"); st.style.transform = `scale(${k}) translate(-50%, -50%)`; st.style.transformOrigin = "0 0";
  st.style.left = "50%"; st.style.top = "50%"; st.style.marginLeft = 0;
  st.style.transform = `translate(${-960 * k}px, ${-540 * k}px) scale(${k})`; }
addEventListener("resize", fit); fit();

/* mulai di slide idle (tanpa suara); #N di URL untuk lompat saat latihan */
(function init() {
  const n = parseInt(location.hash.slice(1), 10);
  const s0 = slides[0]; cur = 0; s0.el.classList.add("active", "on"); sponsorLoop($("#sponsor"));   // sponsor jalan terus di semua slide
  if (n > 1 && n <= slides.length) setTimeout(() => go(n - 1), 50);
  setTimeout(() => $("#hint").style.opacity = 0, 6000);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {});
})();
</script>
